# netlify.toml

[build]
  command = "npm install"
  functions = "netlify/functions"
  publish = "."

[dev]
  framework = "#static"
  staticServerPort = 4000

# إعدادات تجميع الدوال (Functions bundling)
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["web-push", "bcryptjs", "jsonwebtoken", "xlsx", "@supabase/supabase-js"]

# إعادة التوجيه (Redirects)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ========== رأسيات الأمان (Security Headers) ==========

# لجميع الصفحات
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Cross-Origin-Embedder-Policy = "unsafe-none"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# ✅ سياسة أمان المحتوى (CSP)
# frame-src: يسمح بتضمين فيديوهات يوتيوب وفيسبوك في صفحة الأخبار
# img-src / media-src: يسمح بتحميل صور وفيديوهات الأخبار من Supabase Storage
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; media-src 'self' blob: https://*.supabase.co; frame-src https://www.youtube.com https://www.youtube-nocookie.com https://www.facebook.com https://web.facebook.com https://fb.watch; connect-src 'self' https://*.supabase.co; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# للـ Functions
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'none'"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Credentials = "true"

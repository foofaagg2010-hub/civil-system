<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <title>دخول المشرف - الأحوال المدنية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        :root {
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --primary: #0F172A;
            --secondary: #2563EB;
            --secondary-dark: #1D4ED8;
            --green: #16A34A;
            --green-dark: #15803D;
            --whatsapp: #25D366;
            --gold: #C5A03A;
            --danger: #DC2626;
            --muted: #64748B;
            --border: #E2E8F0;
            --radius: 18px;
            --radius-sm: 12px;
            --shadow-sm: 0 1px 3px rgba(15,23,42,0.08);
            --shadow-md: 0 6px 20px rgba(15,23,42,0.10);
            --tr: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
            font-size: 16px;
            overflow-x: hidden;
        }

        .national-bar {
            background: linear-gradient(90deg, #CE1126 0%, #CE1126 33%, #FFFFFF 33%, #FFFFFF 66%, #212122 66%, #212122 100%);
            height: 5px;
            flex-shrink: 0;
        }

        .navbar {
            background: var(--card);
            color: var(--primary);
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: var(--shadow-sm);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
            flex-shrink: 0;
        }

        .logo { display: flex; align-items: center; gap: 8px; min-width: 0; }
        .logo-img { height: 34px; width: auto; object-fit: contain; background: transparent; border-radius: 6px; }
        .logo-img-fallback { display: none; }
        .logo-divider { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; }
        .logo-text { line-height: 1.3; min-width: 0; }
        .logo-text h2 { font-size: 0.95rem; margin: 0; color: var(--primary); font-weight: 800; }
        .logo-text p { font-size: 0.68rem; color: var(--secondary); margin: 1px 0 0; font-weight: 600; }
        .logo-text .sub-title { font-size: 0.58rem; color: var(--muted); margin: 0; }

        .back-btn {
            background: #EEF2FF;
            color: var(--secondary);
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--tr);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            min-height: 44px;
            font-family: inherit;
        }

        .back-btn:hover { background: var(--secondary); color: white; }
        .back-btn:active { transform: scale(0.97); }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px 16px 40px;
        }

        .login-container {
            background: var(--card);
            padding: 32px 22px;
            border-radius: var(--radius);
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            animation: loginFloat 0.6s ease-out;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--gold), var(--secondary), var(--gold));
        }

        @keyframes loginFloat {
            0% { opacity: 0; transform: translateY(24px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .login-icon-wrap {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
            box-shadow: 0 6px 18px rgba(37,99,235,0.25);
        }

        .login-icon-wrap i { font-size: 26px; color: white; }

        .login-container h2 {
            margin-bottom: 4px;
            color: var(--primary);
            font-size: 1.4rem;
            font-weight: 800;
        }

        .login-container .login-sub {
            color: var(--muted);
            margin-bottom: 22px;
            font-size: 0.85rem;
        }

        .input-group {
            margin-bottom: 16px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 700;
            color: var(--primary);
            font-size: 0.85rem;
        }

        .input-group label i { margin-left: 6px; color: var(--secondary); width: 18px; text-align: center; }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-family: inherit;
            transition: var(--tr);
            background: var(--bg);
            color: var(--primary);
            min-height: 48px;
        }

        .input-group input:focus {
            border-color: var(--secondary);
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
        }

        .captcha-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .captcha-question {
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            color: white;
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            font-size: 1.3rem;
            font-weight: 800;
            min-width: 100px;
            text-align: center;
            font-family: 'Courier New', monospace;
            user-select: none;
            border: none;
            direction: ltr;
            white-space: nowrap;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(37,99,235,0.25);
        }

        .captcha-input {
            flex: 1;
            padding: 14px 15px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 1.1rem;
            font-family: inherit;
            direction: ltr;
            text-align: center;
            background: var(--bg);
            transition: var(--tr);
            min-height: 52px;
            color: var(--primary);
            min-width: 0;
        }

        .captcha-input:focus {
            border-color: var(--secondary);
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(37,99,235,0.12);
        }

        .captcha-refresh {
            background: #EEF2FF;
            border: none;
            color: var(--secondary);
            width: 52px;
            height: 52px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 1.05rem;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            flex-shrink: 0;
            transition: var(--tr);
        }

        .captcha-refresh:hover { background: var(--secondary); color: white; }
        .captcha-refresh:active { transform: scale(0.95); }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--secondary), var(--secondary-dark));
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 6px;
            transition: var(--tr);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            min-height: 50px;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: 0.5s;
        }

        .login-btn:hover::before { left: 100%; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 22px rgba(37,99,235,0.3); }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }
        .login-btn:disabled::before { display: none; }

        .error-msg, .success-msg {
            padding: 12px 16px;
            border-radius: var(--radius-sm);
            margin-top: 14px;
            display: none;
            font-size: 0.9rem;
            font-weight: 500;
            animation: fadeIn 0.25s ease;
            text-align: right;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .error-msg {
            background: #FEF2F2;
            color: var(--danger);
            border-right: 4px solid var(--danger);
        }

        .success-msg {
            background: #F0FDF4;
            color: var(--green-dark);
            border-right: 4px solid var(--green);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            color: var(--muted);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            transition: var(--tr);
        }

        .back-link:hover { color: var(--secondary); gap: 10px; }

        .loading-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .footer {
            text-align: center;
            padding: 16px;
            color: var(--muted);
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .navbar { padding: 12px 24px; }
            .logo-img { height: 40px; }
            .logo-text h2 { font-size: 1.1rem; }
            .login-wrapper { padding: 30px 24px 60px; }
            .login-container { padding: 40px 36px; }
            .login-container h2 { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="national-bar"></div>

    <div class="navbar">
        <div class="logo">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <img src="image.png" alt="الجمهورية اليمنية" class="logo-img" style="height:34px;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                <div class="logo-img-fallback" style="display:none;width:34px;height:34px;background:#EEF2FF;border-radius:10px;align-items:center;justify-content:center;flex-shrink:0;"><i class="fas fa-flag" style="font-size:16px;color:#2563EB;"></i></div>
                <div class="logo-divider"></div>
                <img src="images.png" alt="شعار الأحوال المدنية" class="logo-img" style="height:30px;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                <div class="logo-img-fallback" style="display:none;width:30px;height:30px;background:#EEF2FF;border-radius:10px;align-items:center;justify-content:center;flex-shrink:0;"><i class="fas fa-id-card" style="font-size:14px;color:#2563EB;"></i></div>
                <div class="logo-divider"></div>
            </div>
            <div class="logo-text">
                <h2>دخول المشرفين</h2>
                <p>لوحة التحكم والإدارة</p>
                <div class="sub-title">الجمهورية اليمنية</div>
            </div>
        </div>
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-right"></i> العودة
        </a>
    </div>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-icon-wrap">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2>دخول المشرف</h2>
            <p class="login-sub">لوحة التحكم والإدارة - الأحوال المدنية</p>

            <div class="input-group">
                <label><i class="fas fa-user"></i> اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="off">
            </div>

            <div class="input-group">
                <label><i class="fas fa-lock"></i> كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="off">
            </div>

            <div class="input-group">
                <label><i class="fas fa-shield-alt"></i> ادخل ناتج الرقمين أدناه</label>
                <div class="captcha-container">
                    <div class="captcha-question" id="captchaQuestion">AX7F</div>
                    <input type="number" id="captchaInput" class="captcha-input" placeholder="الناتج" dir="ltr" min="0" max="18">
                    <button class="captcha-refresh" onclick="refreshCaptcha()" type="button"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>

            <button class="login-btn" onclick="login()" id="loginBtn"><i class="fas fa-sign-in-alt"></i> دخول</button>

            <div id="errorMsg" class="error-msg"></div>
            <div id="successMsg" class="success-msg"></div>

            <a href="index.html" class="back-link"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
        </div>
    </div>

    <div class="footer">
        <p>جميع الحقوق محفوظة © مصلحة الأحوال المدنية</p>
    </div>

    <script>
        const API_URL = '/.netlify/functions';
        let captchaToken = '';

        async function refreshCaptcha() {
            const questionDiv = document.getElementById('captchaQuestion');
            questionDiv.textContent = '...';
            questionDiv.style.opacity = '0.6';
            document.getElementById('captchaInput').value = '';
            try {
                const response = await fetch(`${API_URL}/get-captcha`);
                if (response.ok) {
                    const data = await response.json();
                    questionDiv.textContent = data.question;
                    captchaToken = data.token;
                    questionDiv.style.opacity = '1';
                } else {
                    questionDiv.textContent = 'تعذر التحميل';
                    captchaToken = '';
                }
            } catch (err) {
                questionDiv.textContent = 'تعذر التحميل';
                captchaToken = '';
            }
            document.getElementById('captchaInput').focus();
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const captchaVal = document.getElementById('captchaInput').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            const loginBtn = document.getElementById('loginBtn');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (!username || !password) {
                errorDiv.innerText = '❌ يرجى إدخال اسم المستخدم وكلمة المرور';
                errorDiv.style.display = 'block';
                return;
            }

            if (username.length > 50) {
                errorDiv.innerText = '❌ اسم المستخدم طويل جداً';
                errorDiv.style.display = 'block';
                return;
            }

            if (!captchaVal || !captchaToken) {
                errorDiv.innerText = '❌ يرجى إدخال ناتج الرقمين';
                errorDiv.style.display = 'block';
                refreshCaptcha();
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner loading-spinner"></i> جاري التحقق...';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, captcha_answer: captchaVal, captcha_token: captchaToken }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'فشل تسجيل الدخول');
                }

                successDiv.innerText = '✅ تم التحقق بنجاح، جاري تحويلك إلى لوحة التحكم...';
                successDiv.style.display = 'block';

                sessionStorage.setItem('admin_token', data.token);
                sessionStorage.setItem('admin_logged_in', 'true');
                sessionStorage.setItem('admin_user_id', data.user.id);
                sessionStorage.setItem('admin_id', data.user.id);
                sessionStorage.setItem('admin_username', data.user.username);
                sessionStorage.setItem('admin_role', data.user.role);
                sessionStorage.setItem('admin_branch', data.user.branch);

                setTimeout(() => {
                    window.location.href = 'admin-panel.html';
                }, 1000);

            } catch (err) {
                if (err.name === 'AbortError') {
                    errorDiv.innerText = '❌ انتهت مهلة الاتصال. تحقق من اتصالك بالإنترنت';
                } else {
                    errorDiv.innerText = '❌ ' + err.message;
                }
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
                refreshCaptcha();
            }
        }

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });

        document.getElementById('captchaInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') login();
        });

        refreshCaptcha();
    </script>
</body>
</html>

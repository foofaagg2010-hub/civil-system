<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <title>دخول المشرف - الأحوال المدنية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .national-bar {
            background: linear-gradient(90deg, #CE1126 0%, #CE1126 33%, #FFFFFF 33%, #FFFFFF 66%, #212122 66%, #212122 100%);
            height: 6px;
            flex-shrink: 0;
        }

        .navbar {
            background: linear-gradient(135deg, #0f1a2e 0%, #1a2a4a 50%, #0f1a2e 100%);
            color: white;
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            border-bottom: 3px solid #C5A03A;
            flex-shrink: 0;
        }

        .logo { display: flex; align-items: center; gap: 14px; }
        .logo-img { height: 48px; width: auto; object-fit: contain; background: rgba(255,255,255,0.05); border-radius: 4px; }
        .logo-img-fallback { display: none; }
        .logo-divider { width: 1px; height: 40px; background: rgba(255,255,255,0.2); flex-shrink: 0; }
        .logo-text { line-height: 1.3; }
        .logo-text h2 { font-size: 1.2rem; margin: 0; color: #f0f0f0; }
        .logo-text p { font-size: 0.8rem; opacity: 0.8; margin: 2px 0 0; color: #C5A03A; }
        .logo-text .sub-title { font-size: 0.7rem; opacity: 0.6; margin: 0; }

        .back-btn {
            background: rgba(255,255,255,0.12);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 10px 22px;
            border-radius: 40px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }

        .back-btn:hover {
            background: rgba(197,160,58,0.25);
            border-color: #C5A03A;
            transform: translateY(-2px);
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .login-container {
            background: white;
            padding: 40px 42px;
            border-radius: 28px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.15);
            animation: loginFloat 0.7s ease-out;
            border: 1px solid rgba(197,160,58,0.12);
            position: relative;
            overflow: hidden;
        }

        .login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #C5A03A, #1a2a4a, #C5A03A);
        }

        @keyframes loginFloat {
            0% { opacity: 0; transform: translateY(40px) scale(0.97); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .login-icon-wrap {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #1a2a4a, #2c4a7c);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            box-shadow: 0 8px 25px rgba(26,42,74,0.2);
        }

        .login-icon-wrap i { font-size: 32px; color: #C5A03A; }

        .login-container h2 {
            margin-bottom: 4px;
            color: #1a2a4a;
            font-size: 1.6rem;
            font-weight: 800;
        }

        .login-container .login-sub {
            color: #888;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #1a2a4a;
            font-size: 13px;
        }

        .input-group label i { margin-left: 6px; color: #C5A03A; width: 18px; text-align: center; }

        .input-group input {
            width: 100%;
            padding: 13px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            transition: 0.3s;
            background: #fafafa;
        }

        .input-group input:focus {
            border-color: #C5A03A;
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(197,160,58,0.1);
        }

        .captcha-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .captcha-question {
            background: linear-gradient(135deg, #1a2a4a, #2c4a7c);
            color: white;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 20px;
            font-weight: 800;
            min-width: 90px;
            text-align: center;
            font-family: 'Courier New', monospace;
            user-select: none;
            border: none;
            direction: ltr;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .captcha-input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
            direction: ltr;
            text-align: center;
            background: #fafafa;
            transition: 0.3s;
        }

        .captcha-input:focus {
            border-color: #C5A03A;
            outline: none;
            background: white;
            box-shadow: 0 0 0 4px rgba(197,160,58,0.1);
        }

        .captcha-refresh {
            background: #95a5a6;
            border: none;
            color: white;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            flex-shrink: 0;
            transition: 0.2s;
        }

        .captcha-refresh:hover { background: #7f8c8d; transform: none; box-shadow: none; }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1a2a4a, #2c4a7c);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }

        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
            transition: 0.5s;
        }

        .login-btn:hover::before { left: 100%; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(26,42,74,0.3); }
        .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; box-shadow: none; }
        .login-btn:disabled::before { display: none; }

        .error-msg, .success-msg {
            padding: 12px 16px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            font-size: 14px;
            font-weight: 500;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .error-msg {
            background: #f8d7da;
            color: #721c24;
            border-right: 4px solid #e74c3c;
        }

        .success-msg {
            background: #d4edda;
            color: #155724;
            border-right: 4px solid #27ae60;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 18px;
            color: #1a2a4a;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.2s;
        }

        .back-link:hover { color: #C5A03A; gap: 10px; }

        .loading-spinner { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.6);
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        @media (max-width: 768px) {
            .navbar { padding: 10px 14px; }
            .logo { gap: 10px; }
            .logo-img { height: 36px !important; }
            .logo-divider { height: 30px; }
            .logo-text h2 { font-size: 0.9rem; }
            .logo-text p { font-size: 0.65rem; }
            .logo-text .sub-title { font-size: 0.6rem; }
            .back-btn { padding: 8px 16px; font-size: 0.8rem; }
            .login-wrapper { padding: 20px 14px; }
            .login-container { padding: 30px 24px; border-radius: 22px; }
            .login-icon-wrap { width: 60px; height: 60px; }
            .login-icon-wrap i { font-size: 26px; }
            .login-container h2 { font-size: 1.3rem; }
            .login-container .login-sub { font-size: 13px; margin-bottom: 22px; }
            .input-group { margin-bottom: 14px; }
            .input-group input { padding: 11px 14px; font-size: 14px; }
            .captcha-question { font-size: 18px; min-width: 80px; padding: 8px 12px; }
            .captcha-input { padding: 10px 12px; font-size: 15px; }
            .captcha-refresh { width: 40px; height: 40px; font-size: 16px; }
            .login-btn { padding: 12px; font-size: 15px; }
        }

        @media (max-width: 480px) {
            .navbar { padding: 8px 10px; gap: 8px; }
            .logo { gap: 6px; }
            .logo-img { height: 28px !important; }
            .logo-divider { height: 24px; }
            .logo-text h2 { font-size: 0.75rem; }
            .logo-text p { font-size: 0.55rem; }
            .logo-text .sub-title { font-size: 0.5rem; }
            .back-btn { padding: 6px 12px; font-size: 0.75rem; gap: 5px; }
            .login-wrapper { padding: 14px 10px; }
            .login-container { padding: 24px 18px; border-radius: 18px; }
            .login-icon-wrap { width: 52px; height: 52px; margin-bottom: 12px; }
            .login-icon-wrap i { font-size: 22px; }
            .login-container h2 { font-size: 1.1rem; }
            .login-container .login-sub { font-size: 12px; margin-bottom: 18px; }
            .input-group { margin-bottom: 12px; }
            .input-group label { font-size: 12px; }
            .input-group input { padding: 10px 12px; font-size: 13px; border-radius: 10px; }
            .captcha-question { font-size: 16px; min-width: 70px; padding: 6px 10px; border-radius: 10px; }
            .captcha-input { padding: 8px 10px; font-size: 14px; border-radius: 10px; }
            .captcha-refresh { width: 36px; height: 36px; font-size: 14px; border-radius: 10px; }
            .login-btn { padding: 11px; font-size: 14px; border-radius: 10px; }
            .error-msg, .success-msg { padding: 10px 12px; font-size: 13px; }
            .back-link { font-size: 13px; }
        }
    </style>
</head>
<body>
    <div class="national-bar"></div>

    <div class="navbar">
        <div class="logo">
            <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
                <img src="image.png" alt="الجمهورية اليمنية" class="logo-img" style="height:50px;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                <div class="logo-img-fallback" style="display:none;width:50px;height:50px;background:rgba(255,255,255,0.1);border-radius:50%;align-items:center;justify-content:center;flex-shrink:0;"><i class="fas fa-flag" style="font-size:24px;color:#C5A03A;"></i></div>
                <div class="logo-divider"></div>
                <img src="images.png" alt="شعار الأحوال المدنية" class="logo-img" style="height:46px;" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                <div class="logo-img-fallback" style="display:none;width:46px;height:46px;background:rgba(255,255,255,0.1);border-radius:50%;align-items:center;justify-content:center;flex-shrink:0;"><i class="fas fa-id-card" style="font-size:22px;color:#C5A03A;"></i></div>
                <div class="logo-divider"></div>
            </div>
            <div class="logo-text">
                <h2>دخول المشرفين</h2>
                <p>لوحة التحكم والإدارة</p>
                <div class="sub-title">الجمهورية اليمنية</div>
            </div>
        </div>
        <a href="index.html" class="back-btn">
            <i class="fas fa-arrow-right"></i> العودة
        </a>
    </div>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="login-icon-wrap">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2>دخول المشرف</h2>
            <p class="login-sub">لوحة التحكم والإدارة - الأحوال المدنية</p>

            <div class="input-group">
                <label><i class="fas fa-user"></i> اسم المستخدم</label>
                <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="off">
            </div>

            <div class="input-group">
                <label><i class="fas fa-lock"></i> كلمة المرور</label>
                <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="off">
            </div>

            <div class="input-group">
                <label><i class="fas fa-shield-alt"></i> ادخل ناتج الرقمين أدناه</label>
                <div class="captcha-container">
                    <div class="captcha-question" id="captchaQuestion">AX7F</div>
                    <input type="number" id="captchaInput" class="captcha-input" placeholder="الناتج" dir="ltr" min="0" max="18">
                    <button class="captcha-refresh" onclick="refreshCaptcha()" type="button"><i class="fas fa-sync-alt"></i></button>
                </div>
            </div>

            <button class="login-btn" onclick="login()" id="loginBtn"><i class="fas fa-sign-in-alt"></i> دخول</button>

            <div id="errorMsg" class="error-msg"></div>
            <div id="successMsg" class="success-msg"></div>

            <a href="index.html" class="back-link"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
        </div>
    </div>

    <div class="footer">
        <p>جميع الحقوق محفوظة © مصلحة الأحوال المدنية</p>
    </div>

    <script>
        const API_URL = '/.netlify/functions';
        let captchaToken = '';

        async function refreshCaptcha() {
            const questionDiv = document.getElementById('captchaQuestion');
            questionDiv.textContent = '...';
            questionDiv.style.opacity = '0.6';
            document.getElementById('captchaInput').value = '';
            try {
                const response = await fetch(`${API_URL}/get-captcha`);
                if (response.ok) {
                    const data = await response.json();
                    questionDiv.textContent = data.question;
                    captchaToken = data.token;
                    questionDiv.style.opacity = '1';
                } else {
                    questionDiv.textContent = 'تعذر التحميل';
                    captchaToken = '';
                }
            } catch (err) {
                questionDiv.textContent = 'تعذر التحميل';
                captchaToken = '';
            }
            document.getElementById('captchaInput').focus();
        }

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const captchaVal = document.getElementById('captchaInput').value.trim();
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            const loginBtn = document.getElementById('loginBtn');

            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            if (!username || !password) {
                errorDiv.innerText = '❌ يرجى إدخال اسم المستخدم وكلمة المرور';
                errorDiv.style.display = 'block';
                return;
            }

            if (username.length > 50) {
                errorDiv.innerText = '❌ اسم المستخدم طويل جداً';
                errorDiv.style.display = 'block';
                return;
            }

            if (!captchaVal || !captchaToken) {
                errorDiv.innerText = '❌ يرجى إدخال ناتج الرقمين';
                errorDiv.style.display = 'block';
                refreshCaptcha();
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-spinner loading-spinner"></i> جاري التحقق...';

            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, captcha_answer: captchaVal, captcha_token: captchaToken }),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'فشل تسجيل الدخول');
                }

                successDiv.innerText = '✅ تم التحقق بنجاح، جاري تحويلك إلى لوحة التحكم...';
                successDiv.style.display = 'block';

                sessionStorage.setItem('admin_token', data.token);
                sessionStorage.setItem('admin_logged_in', 'true');
                sessionStorage.setItem('admin_user_id', data.user.id);
                sessionStorage.setItem('admin_id', data.user.id);
                sessionStorage.setItem('admin_username', data.user.username);
                sessionStorage.setItem('admin_role', data.user.role);
                sessionStorage.setItem('admin_branch', data.user.branch);

                setTimeout(() => {
                    window.location.href = 'admin-panel.html';
                }, 1000);

            } catch (err) {
                if (err.name === 'AbortError') {
                    errorDiv.innerText = '❌ انتهت مهلة الاتصال. تحقق من اتصالك بالإنترنت';
                } else {
                    errorDiv.innerText = '❌ ' + err.message;
                }
                errorDiv.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> دخول';
                refreshCaptcha();
            }
        }

        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });

        document.getElementById('captchaInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') login();
        });

        refreshCaptcha();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول المشرف - الأحوال المدنية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            padding: 45px;
            border-radius: 32px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            animation: fadeInUp 0.6s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .login-container i.logo-icon { font-size: 65px; color: #3498db; margin-bottom: 20px; }
        .login-container h2 { margin-bottom: 10px; color: #2c3e50; font-size: 1.8rem; }
        .login-container p { color: #666; margin-bottom: 30px; }
        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
        }
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 16px;
            font-size: 16px;
            font-family: inherit;
            transition: 0.3s;
        }
        input:focus { border-color: #3498db; outline: none; box-shadow: 0 0 0 3px rgba(52,152,219,0.1); }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(52,152,219,0.3); }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
        }
        .back-link {
            display: block;
            margin-top: 20px;
            color: #3498db;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <i class="fas fa-user-shield logo-icon"></i>
        <h2>دخول المشرف</h2>
        <p>لوحة التحكم والإدارة - الأحوال المدنية</p>
        
        <div class="input-group">
            <label><i class="fas fa-user"></i> اسم المستخدم</label>
            <input type="text" id="username" placeholder="أدخل اسم المستخدم" autocomplete="off">
        </div>
        <div class="input-group">
            <label><i class="fas fa-lock"></i> كلمة المرور</label>
            <input type="password" id="password" placeholder="أدخل كلمة المرور" autocomplete="off">
        </div>
        <button onclick="login()"><i class="fas fa-sign-in-alt"></i> دخول</button>
        
        <div id="errorMsg" class="error"></div>
        <div id="successMsg" class="success"></div>
        <a href="index.html" class="back-link">← العودة للرئيسية</a>
    </div>
    
    <script>
        const API_URL = '/.netlify/functions';
        
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMsg');
            const successDiv = document.getElementById('successMsg');
            
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';
            
            if (!username || !password) {
                errorDiv.innerText = '❌ يرجى إدخال اسم المستخدم وكلمة المرور';
                errorDiv.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error);
                }
                
                successDiv.innerText = '✅ جاري تحويلك إلى لوحة التحكم...';
                successDiv.style.display = 'block';
                
                sessionStorage.setItem('admin_token', data.token);
                sessionStorage.setItem('admin_logged_in', 'true');
                sessionStorage.setItem('admin_id', data.user.id);
                sessionStorage.setItem('admin_username', data.user.username);
                sessionStorage.setItem('admin_role', data.user.role);
                sessionStorage.setItem('admin_branch', data.user.branch);
                
                setTimeout(() => {
                    window.location.href = 'admin-panel.html';
                }, 1000);
                
            } catch (err) {
                errorDiv.innerText = `❌ ${err.message}`;
                errorDiv.style.display = 'block';
            }
        }
        
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
